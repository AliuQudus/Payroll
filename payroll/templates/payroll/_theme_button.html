<form method="post" action="{% url 'set_theme' %}" class="theme-form noprint">{% csrf_token %}
<input type="hidden" name="theme" value="{{ theme_next|default:'light' }}"><input type="hidden" name="next" value="{{ request.get_full_path }}">
<button type="submit" class="theme-btn" id="theme-btn" aria-label="Switch to {{ theme_next|default:'light' }} mode"><span class="ico" aria-hidden="true">{% if theme_next == "dark" %}&#9790;{% else %}&#9728;{% endif %}</span><span class="lbl">{% if theme_next == "dark" %}Dark{% else %}Light{% endif %} mode</span></button></form>
